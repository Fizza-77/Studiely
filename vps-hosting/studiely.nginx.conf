# Studiely static site (Next export: use out/ or deploy/ after merge).
# 1. Set root below to /var/www/studiely/out OR /var/www/studiely/deploy (see vps-hosting/README.md).
# 2. sudo cp vps-hosting/studiely.nginx.conf /etc/nginx/sites-available/studiely
# 3. sudo ln -sf /etc/nginx/sites-available/studiely /etc/nginx/sites-enabled/
# 4. sudo rm -f /etc/nginx/sites-enabled/default
# 5. sudo nginx -t && sudo systemctl reload nginx
# 6. npm run check:vps-dns  (must show your VPS IP before step 7)
# 7. sudo certbot --nginx -d studiely.com -d www.studiely.com
#
# After certbot, choose “Redirect HTTP to HTTPS”. If apex HTTPS redirect is wrong,
# ensure studiely.com on :443 redirects to https://www.studiely.com$request_uri.

server {
    listen 80;
    listen [::]:80;
    server_name studiely.com;
    return 301 http://www.studiely.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.studiely.com;

    root /var/www/studiely/deploy;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    location = /pricing {
        return 301 $scheme://www.studiely.com/;
    }
    location = /pricing/ {
        return 301 $scheme://www.studiely.com/;
    }

    # Same as firebase.json (Next export does not apply redirects())
    location ~ ^/blog/full/(.+)$ {
        return 301 $scheme://www.studiely.com/blog/$1;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
