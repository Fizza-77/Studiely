# Studiely marketing site (Next.js static export → out/)
# WARNING: This file is HTTP-only. If Certbot already added HTTPS on the server,
# do NOT scp this file over /etc/nginx/sites-available/studiely.com — you will
# remove SSL and browsers will show “connection is not private”. Use Certbot to
# repair (see infra/VPS-UPDATE-SIMPLE.txt STEP 13) and only edit try_files by hand.
# Install on server (no nano — use scp + ln):
#   scp infra/nginx-studiely.com.conf root@YOUR_VPS:/etc/nginx/sites-available/studiely.com
#   ssh root@YOUR_VPS 'ln -sf /etc/nginx/sites-available/studiely.com /etc/nginx/sites-enabled/studiely.com && nginx -t && systemctl reload nginx'
#
# HTTPS (only studiely.com / www — does not touch other vhosts). DNS must point here first:
#   certbot --nginx -d studiely.com -d www.studiely.com
# After certbot edits this file, ensure the HTTPS server { ... } block uses the SAME
# location / and try_files line as below (certbot sometimes duplicates the :80 block).

server {
    listen 80;
    listen [::]:80;
    server_name studiely.com www.studiely.com;

    root /var/www/studiely/site/out;
    index index.html;

    # Next export emits foo.html plus foo/ (RSC metadata only, no index.html). If $uri/
    # is tried before $uri.html, nginx maps /foo to the empty directory → 403 Forbidden.
    location / {
        try_files $uri.html $uri $uri/ /404.html;
    }

    access_log /var/log/nginx/studiely-access.log;
    error_log /var/log/nginx/studiely-error.log;
}
